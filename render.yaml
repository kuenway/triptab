# Release ordering: green CI -> operator Alembic migration -> manual deployment.
services:
  - type: web
    name: triptab-api
    runtime: python
    rootDir: backend
    branch: main
    region: singapore
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: uv sync --locked --no-dev
    startCommand: uv run --locked --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 8 --no-access-log --no-proxy-headers
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: verify-full
      - key: PGSSLROOTCERT
        value: system
      - key: PGCHANNELBINDING
        value: require
      - key: TRIPTAB_ENV
        value: production
      - key: TRIPTAB_ALLOWED_ORIGINS
        sync: false
      - key: TRIPTAB_COOKIE_SECURE
        value: "true"
      - key: TRIPTAB_COOKIE_NAME
        value: triptab_session
      - key: TRIPTAB_SESSION_SECONDS
        value: "604800"
      - key: TRIPTAB_LOG_LEVEL
        value: INFO
      - key: TRIPTAB_DEBUG
        value: "false"
      - key: TRIPTAB_AUTH_RATE_LIMIT
        value: "10"
      - key: TRIPTAB_AUTH_GLOBAL_LIMIT
        value: "100"
      - key: TRIPTAB_AUTH_RATE_WINDOW
        value: "60"
