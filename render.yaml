# Initial production deployments are manual and require green GitHub CI.
services:
  - type: web
    name: triptab-api
    runtime: python
    rootDir: backend
    branch: main
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: uv sync --locked --no-dev
    preDeployCommand: uv run --locked --no-dev alembic upgrade head
    startCommand: uv run --locked --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 4 --no-access-log --no-proxy-headers
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: triptab-db
          property: connectionString
      - key: PGSSLMODE
        value: require
      - key: TRIPTAB_ENV
        value: production
      - key: TRIPTAB_ALLOWED_ORIGINS
        sync: false
      - key: TRIPTAB_COOKIE_SECURE
        value: "true"
      - key: TRIPTAB_COOKIE_NAME
        value: triptab_session
      - key: TRIPTAB_SESSION_SECONDS
        value: "604800"
      - key: TRIPTAB_LOG_LEVEL
        value: INFO
      - key: TRIPTAB_DEBUG
        value: "false"
      - key: TRIPTAB_AUTH_RATE_LIMIT
        value: "10"
      - key: TRIPTAB_AUTH_GLOBAL_LIMIT
        value: "100"
      - key: TRIPTAB_AUTH_RATE_WINDOW
        value: "60"

databases:
  - name: triptab-db
    databaseName: triptab
    user: triptab
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    diskSizeGB: 1
    ipAllowList: []
