name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: triptab
          POSTGRES_PASSWORD: triptab_ci_only
          POSTGRES_DB: triptab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triptab -d triptab_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://triptab:triptab_ci_only@127.0.0.1:5432/triptab_test
      TEST_DATABASE_URL: postgresql+psycopg://triptab:triptab_ci_only@127.0.0.1:5432/triptab_test
      TRIPTAB_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.11
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked alembic upgrade head
      - run: uv run --locked alembic check
      - run: uv run --locked pytest -q

  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: triptab
          POSTGRES_PASSWORD: triptab_ci_only
          POSTGRES_DB: triptab_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triptab -d triptab_e2e_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://triptab:triptab_ci_only@127.0.0.1:5432/triptab_e2e_test
      E2E_DATABASE_URL: postgresql+psycopg://triptab:triptab_ci_only@127.0.0.1:5432/triptab_e2e_test
      TRIPTAB_API_ORIGIN: http://127.0.0.1:8100
      TRIPTAB_ENV: test
      E2E_PRODUCTION: "true"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.11
        working-directory: backend
      - run: uv run --locked alembic upgrade head
        working-directory: backend
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
